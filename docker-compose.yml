version: "3.9"

services:
  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfile

    env_file:
      - .env

    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/rsa_key.p8

    volumes:
      - .:/app
      - ./profiles.yml:/root/.dbt/profiles.yml
      - /home/technonext/keys:/keys:ro

    command: debug

    healthcheck:
      test: ["CMD", "dbt", "debug"]
      interval: 60s
      timeout: 20s
      retries: 3